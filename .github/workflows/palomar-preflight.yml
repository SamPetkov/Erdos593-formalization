name: Palomar preflight

# Runs Palomar's complete reusable verification workflow as an advisory
# mechanical preflight. It does not submit anything to Palomar.
# workflow_dispatch works once this file is on the default branch; until then
# pushes to the port branch trigger it.
on:
  workflow_dispatch:
  push:
    branches:
      - palomar-module-port

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
